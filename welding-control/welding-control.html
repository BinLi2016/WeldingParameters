<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self' http://192.168.58.2:20003; img-src 'self' data:;">
    <title>焊机操作控制</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <style>
        /* Custom styles for welding control */
        .control-card {
            min-height: auto;
        }
        
        .control-button {
            min-height: 60px;
            font-size: 1.1rem;
            font-weight: 600;
            margin: 5px;
            position: relative;
            overflow: hidden;
        }
        
        .control-button.active {
            box-shadow: 0 0 20px rgba(13, 110, 253, 0.5);
            transform: scale(1.02);
        }
        

        
        .arc-button {
            background: linear-gradient(135deg, #dc3545, #c82333);
        }
        
        .arc-button:hover {
            background: linear-gradient(135deg, #c82333, #dc3545);
        }
        
        .wire-button {
            background: linear-gradient(135deg, #28a745, #20c997);
        }
        
        .wire-button:hover {
            background: linear-gradient(135deg, #20c997, #28a745);
        }
        
        .motion-button {
            background: linear-gradient(135deg, #007bff, #0056b3);
        }
        
        .motion-button:hover {
            background: linear-gradient(135deg, #0056b3, #007bff);
        }
        
        .status-display {
            background-color: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
        }
        
        .connection-status {
            font-weight: bold;
        }
        
        .connection-status.connected {
            color: #28a745;
        }
        
        .connection-status.disconnected {
            color: #dc3545;
        }
        
        .timestamp {
            color: #6c757d;
            font-size: 0.9rem;
        }

        /* Toast animation */
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- Header -->
        <div class="row bg-primary text-white py-3">
            <div class="col">
                <h1 class="mb-0">
                    <i class="bi bi-gear-wide-connected me-2"></i>
                    焊机操作控制
                </h1>
            </div>
        </div>

        <!-- Main Content -->
        <div class="row mt-4">
            <!-- Control Panel -->
            <div class="col-md-8">
                <!-- Arc Control -->
                <div class="card control-card mb-2">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="bi bi-lightning-fill me-2"></i>
                            电弧控制
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="d-grid">
                            <button class="btn control-button arc-button" id="arcStart">
                                <i class="bi bi-play-fill me-2"></i>
                                起弧
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Wire Control -->
                <div class="card control-card mb-2">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="bi bi-arrow-repeat me-2"></i>
                            送丝控制
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="d-grid">
                                    <button class="btn control-button wire-button" id="wireFeed">
                                        <i class="bi bi-arrow-right-circle me-2"></i>
                                        进丝
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="d-grid">
                                    <button class="btn control-button wire-button" id="wireRetract">
                                        <i class="bi bi-arrow-left-circle me-2"></i>
                                        退丝
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Motion Control -->
                <div class="card control-card mb-2">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="bi bi-arrows-move me-2"></i>
                            运动控制
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="d-grid">
                                    <button class="btn control-button motion-button" id="motionXPlus">
                                        <i class="bi bi-plus-circle me-2"></i>
                                        点动X+
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="d-grid">
                                    <button class="btn control-button motion-button" id="motionXMinus">
                                        <i class="bi bi-dash-circle me-2"></i>
                                        点动X-
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Status Panel -->
            <div class="col-md-4">
                <!-- Connection Status -->
                <div class="card mb-2">
                    <div class="card-header">
                        <h6 class="mb-0">
                            <i class="bi bi-wifi me-2"></i>
                            连接状态
                        </h6>
                    </div>
                    <div class="card-body">
                        <div class="status-display">
                            <div class="connection-status" id="connectionStatus">CONNECTING...</div>
                            <div id="connectionDetails" style="font-size: 0.9rem; color: #6c757d; margin-top: 5px;">192.168.58.2:20003</div>
                        </div>
                    </div>
                </div>

                <!-- Robot Status -->
                <div class="card mb-2">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h6 class="mb-0">
                            <i class="bi bi-robot me-2"></i>
                            机器人状态
                        </h6>
                        <button class="btn btn-sm btn-outline-warning" id="errorResetBtn" title="重置机器人错误">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="status-display" id="status">
                            状态: 待机中
                        </div>
                    </div>
                </div>


            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const arcStartBtn = document.getElementById('arcStart');
        const wireFeedBtn = document.getElementById('wireFeed');
        const wireRetractBtn = document.getElementById('wireRetract');
        const motionXPlusBtn = document.getElementById('motionXPlus');
        const motionXMinusBtn = document.getElementById('motionXMinus');
        const statusDiv = document.getElementById('status');

        const connectionStatusDiv = document.getElementById('connectionStatus');
        const connectionDetailsDiv = document.getElementById('connectionDetails');

        let arcActive = false;
        let wireFeedActive = false;
        let wireRetractActive = false;
        let motionXPlusActive = false;
        let motionXMinusActive = false;

        function updateStatus() {
            let statusText = '状态: ';
            let statusClass = '';
            
            if (arcActive) {
                statusText += '起弧中';
                statusClass = 'active';
            } else if (wireFeedActive) {
                statusText += '进丝中';
                statusClass = 'active';
            } else if (wireRetractActive) {
                statusText += '退丝中';
                statusClass = 'active';
            } else if (motionXPlusActive) {
                statusText += '点动X+中';
                statusClass = 'active';
            } else if (motionXMinusActive) {
                statusText += '点动X-中';
                statusClass = 'active';
            } else {
                statusText += '待机中';
            }
            
            statusDiv.textContent = statusText;
            statusDiv.className = 'status ' + statusClass;
        }







        // 物理按钮键盘映射配置
        const BUTTON_MAPPINGS = {
            arc: { keys: ['control', 'alt', 'p'], description: '起弧按钮: Ctrl + Alt + P' },
            feed: { keys: ['control', 'alt', 'f'], description: '进丝按钮: Ctrl + Alt + F' },
            retract: { keys: ['control', 'alt', 'r'], description: '退丝按钮: Ctrl + Alt + R' }
        };

        // 键盘按键状态跟踪
        let keysPressed = new Set();
        
        // 防重复调用标志
        let arcStartDebounce = false;

        // 初始化状态
        updateStatus();

        // XML-RPC 客户端配置
        const ROBOT_IP = "192.168.58.2";
        const ROBOT_PORT = "20003";
        const ROBOT_URL = `http://${ROBOT_IP}:${ROBOT_PORT}`;

        // 焊接参数配置
        const WELDING_CONFIG = {
            // 焊接方法参数
            ioType: 0,              // IO类型: 0-控制器IO, 1-扩展IO
            arcNum: 1,              // 焊机配置文件编号
            arcTimeout: 5000,       // 起弧超时时间 (毫秒)
            
            // 备用：传统数字输出配置 (如果需要手动控制)
            arcDO: 0,           // 起弧数字输出端口
            wireFeedDO: 1,      // 进丝数字输出端口  
            wireRetractDO: 2,   // 退丝数字输出端口
            
            // 备用：模拟输出配置 (如果需要手动控制)
            arcAO: 0,           // 起弧模拟输出端口
            arcPower: 50,       // 起弧功率百分比 (0-100)
            wireFeedAO: 1,      // 进丝模拟输出端口
            wireFeedSpeed: 30,  // 进丝速度百分比 (0-100)
            wireRetractSpeed: 20, // 退丝速度百分比 (0-100)
            
            // 备用：工具数字输出配置
            arcToolDO: 0,       // 起弧工具数字输出端口
        };

        // 简单的XML-RPC客户端实现
        class XMLRPCClient {
            constructor(url) {
                this.url = url;
                this.requestId = 0;
            }

            async call(methodName, ...params) {
                this.requestId++;
                const currentRequestId = this.requestId;
                
                console.log(`[XML-RPC ${currentRequestId}] 调用方法: ${methodName}`, params);
                
                const xmlRequest = this.buildXMLRequest(methodName, params);
                console.log(`[XML-RPC ${currentRequestId}] 请求XML:`, xmlRequest);
                
                try {
                    const response = await fetch(this.url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'text/xml; charset=utf-8',
                            'User-Agent': 'WeldingControl/1.0',
                            'SOAPAction': '""',
                            'Accept': 'text/xml',
                            'Cache-Control': 'no-cache'
                        },
                        body: xmlRequest,
                        mode: 'cors',
                        credentials: 'omit'
                    });

                    console.log(`[XML-RPC ${currentRequestId}] HTTP状态:`, response.status, response.statusText);
                    
                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error(`[XML-RPC ${currentRequestId}] HTTP错误响应:`, errorText);
                        throw new Error(`HTTP error! status: ${response.status} - ${errorText}`);
                    }

                    const xmlResponse = await response.text();
                    console.log(`[XML-RPC ${currentRequestId}] 响应XML:`, xmlResponse);
                    
                    const result = this.parseXMLResponse(xmlResponse);
                    
                    console.log(`[XML-RPC ${currentRequestId}] 解析结果:`, result);
                    return result;
                } catch (error) {
                    console.error(`[XML-RPC ${currentRequestId}] 调用失败:`, error);
                    return { error: error.message };
                }
            }

            buildXMLRequest(methodName, params) {
                let paramXml = '';
                params.forEach(param => {
                    if (typeof param === 'number') {
                        // Use int for integers, double for floats
                        if (Number.isInteger(param)) {
                            paramXml += `<param><value><int>${param}</int></value></param>`;
                        } else {
                            paramXml += `<param><value><double>${param}</double></value></param>`;
                        }
                    } else if (typeof param === 'string') {
                        paramXml += `<param><value><string>${param}</string></value></param>`;
                    } else if (Array.isArray(param)) {
                        paramXml += `<param><value><array><data>`;
                        param.forEach(item => {
                            if (typeof item === 'number') {
                                if (Number.isInteger(item)) {
                                    paramXml += `<value><int>${item}</int></value>`;
                                } else {
                                    paramXml += `<value><double>${item}</double></value>`;
                                }
                            } else {
                                paramXml += `<value><string>${item}</string></value>`;
                            }
                        });
                        paramXml += `</data></array></value></param>`;
                    }
                });

                return `<?xml version="1.0" encoding="UTF-8"?>
<methodCall>
    <methodName>${methodName}</methodName>
    <params>
        ${paramXml}
    </params>
</methodCall>`;
            }

            parseXMLResponse(xmlString) {
                try {
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlString, "text/xml");
                    
                    // Check for XML parsing errors
                    const parseError = xmlDoc.querySelector('parsererror');
                    if (parseError) {
                        return { error: 'XML parsing error: ' + parseError.textContent };
                    }
                    
                    // Check for fault response
                    const fault = xmlDoc.querySelector('fault');
                    if (fault) {
                        const faultValue = fault.querySelector('value');
                        if (faultValue) {
                            return { error: 'Robot fault: ' + faultValue.textContent };
                        }
                        return { error: 'Robot returned fault' };
                    }

                    // Parse successful response
                    const value = xmlDoc.querySelector('methodResponse params param value');
                    if (value) {
                        const int = value.querySelector('int');
                        const double = value.querySelector('double');
                        const string = value.querySelector('string');
                        const array = value.querySelector('array');
                        
                        if (int) return parseInt(int.textContent);
                        if (double) return parseFloat(double.textContent);
                        if (string) return string.textContent;
                        if (array) {
                            const values = array.querySelectorAll('value');
                            return Array.from(values).map(v => {
                                const i = v.querySelector('int');
                                const d = v.querySelector('double');
                                const s = v.querySelector('string');
                                if (i) return parseInt(i.textContent);
                                if (d) return parseFloat(d.textContent);
                                if (s) return s.textContent;
                                return null;
                            });
                        }
                    }
                    
                    // Default: return 0 for success (common in robot API)
                    return 0;
                } catch (error) {
                    return { error: 'Failed to parse XML response: ' + error.message };
                }
            }
        }

        // Node.js HTTP客户端 (用于Electron环境)
        class NodeXMLRPCClient {
            constructor(ip, port) {
                this.ip = ip;
                this.port = port;
                this.requestId = 0;
                
                // 检查是否在Electron环境中
                if (typeof require !== 'undefined') {
                    try {
                        this.http = require('http');
                        this.isNodeAvailable = true;
                        console.log('Node.js HTTP模块可用，使用Node.js客户端');
                    } catch (e) {
                        this.isNodeAvailable = false;
                        console.log('Node.js HTTP模块不可用，使用浏览器fetch');
                    }
                } else {
                    this.isNodeAvailable = false;
                    console.log('不在Node.js环境中，使用浏览器fetch');
                }
            }
            
            async call(methodName, ...params) {
                this.requestId++;
                const currentRequestId = this.requestId;
                
                console.log(`[Node-XML-RPC ${currentRequestId}] 调用方法: ${methodName}`, params);
                
                const xmlRequest = this.buildXMLRequest(methodName, params);
                console.log(`[Node-XML-RPC ${currentRequestId}] 请求XML:`, xmlRequest);
                
                if (this.isNodeAvailable) {
                    return this.sendNodeRequest(xmlRequest, currentRequestId);
                } else {
                    return this.sendFetchRequest(xmlRequest, currentRequestId);
                }
            }
            
            buildXMLRequest(methodName, params) {
                let paramXml = '';
                params.forEach((param, index) => {
                    if (typeof param === 'number') {
                        // Special handling for StartJOG method - force last 3 parameters to be double
                        if (methodName === 'StartJOG' && index >= 3) {
                            paramXml += `<param><value><double>${param}</double></value></param>`;
                        } else if (param % 1 !== 0 || param.toString().includes('.')) {
                            paramXml += `<param><value><double>${param}</double></value></param>`;
                        } else {
                            paramXml += `<param><value><int>${param}</int></value></param>`;
                        }
                    } else if (typeof param === 'string') {
                        paramXml += `<param><value><string>${param}</string></value></param>`;
                    } else if (Array.isArray(param)) {
                        paramXml += `<param><value><array><data>`;
                        param.forEach(item => {
                            if (typeof item === 'number') {
                                if (item % 1 !== 0 || item.toString().includes('.')) {
                                    paramXml += `<value><double>${item}</double></value>`;
                                } else {
                                    paramXml += `<value><int>${item}</int></value>`;
                                }
                            } else if (typeof item === 'string') {
                                paramXml += `<value><string>${item}</string></value>`;
                            }
                        });
                        paramXml += `</data></array></value></param>`;
                    }
                });

                return `<?xml version="1.0" encoding="UTF-8"?>
<methodCall>
    <methodName>${methodName}</methodName>
    <params>
        ${paramXml}
    </params>
</methodCall>`;
            }
            
            sendNodeRequest(xmlRequest, requestId) {
                return new Promise((resolve, reject) => {
                    const postData = xmlRequest;
                    
                    const options = {
                        hostname: this.ip,
                        port: this.port,
                        path: '/RPC2',
                        method: 'POST',
                        headers: {
                            'Content-Type': 'text/xml; charset=utf-8',
                            'Content-Length': Buffer.byteLength(postData, 'utf8'),
                            'User-Agent': 'WeldingControl-Node/1.0'
                        },
                        timeout: 10000
                    };
                    
                    const req = this.http.request(options, (res) => {
                        console.log(`[Node-XML-RPC ${requestId}] HTTP状态:`, res.statusCode);
                        
                        let responseData = '';
                        res.on('data', (chunk) => {
                            responseData += chunk;
                        });
                        
                        res.on('end', () => {
                            console.log(`[Node-XML-RPC ${requestId}] 响应XML:`, responseData);
                            
                            if (res.statusCode === 200) {
                                const result = this.parseXMLResponse(responseData);
                                console.log(`[Node-XML-RPC ${requestId}] 解析结果:`, result);
                                resolve(result);
                            } else {
                                console.error(`[Node-XML-RPC ${requestId}] HTTP错误:`, res.statusCode, responseData);
                                resolve({ error: `HTTP ${res.statusCode}: ${responseData}` });
                            }
                        });
                    });
                    
                    req.on('error', (e) => {
                        console.error(`[Node-XML-RPC ${requestId}] 请求错误:`, e);
                        resolve({ error: e.message });
                    });
                    
                    req.on('timeout', () => {
                        console.error(`[Node-XML-RPC ${requestId}] 请求超时`);
                        req.destroy();
                        resolve({ error: 'Request timeout' });
                    });
                    
                    req.write(postData);
                    req.end();
                });
            }
            
            async sendFetchRequest(xmlRequest, requestId) {
                try {
                    const response = await fetch(`http://${this.ip}:${this.port}/RPC2`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'text/xml; charset=utf-8',
                            'User-Agent': 'WeldingControl-Fetch/1.0'
                        },
                        body: xmlRequest
                    });

                    console.log(`[Fetch-XML-RPC ${requestId}] HTTP状态:`, response.status);
                    
                    const xmlResponse = await response.text();
                    console.log(`[Fetch-XML-RPC ${requestId}] 响应XML:`, xmlResponse);
                    
                    if (response.ok) {
                        const result = this.parseXMLResponse(xmlResponse);
                        console.log(`[Fetch-XML-RPC ${requestId}] 解析结果:`, result);
                        return result;
                    } else {
                        console.error(`[Fetch-XML-RPC ${requestId}] HTTP错误:`, response.status, xmlResponse);
                        return { error: `HTTP ${response.status}: ${xmlResponse}` };
                    }
                } catch (error) {
                    console.error(`[Fetch-XML-RPC ${requestId}] 调用失败:`, error);
                    return { error: error.message };
                }
            }
            
            parseXMLResponse(xmlString) {
                try {
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlString, "text/xml");
                    
                    const parseError = xmlDoc.querySelector('parsererror');
                    if (parseError) {
                        return { error: 'XML parsing error: ' + parseError.textContent };
                    }
                    
                    const fault = xmlDoc.querySelector('fault');
                    if (fault) {
                        return { error: 'Robot fault: ' + fault.textContent };
                    }

                    const value = xmlDoc.querySelector('methodResponse params param value');
                    if (value) {
                        const int = value.querySelector('int');
                        const i4 = value.querySelector('i4');
                        const double = value.querySelector('double');
                        const string = value.querySelector('string');
                        const array = value.querySelector('array');
                        
                        if (array) {
                            const values = array.querySelectorAll('value');
                            const result = Array.from(values).map(v => {
                                const i = v.querySelector('int');
                                const i4 = v.querySelector('i4');
                                const d = v.querySelector('double');
                                const s = v.querySelector('string');
                                if (i) return parseInt(i.textContent);
                                if (i4) return parseInt(i4.textContent);
                                if (d) return parseFloat(d.textContent);
                                if (s) return s.textContent;
                                return null;
                            });
                            console.log('XML解析数组结果:', result);
                            return result;
                        }
                        if (int) return parseInt(int.textContent);
                        if (i4) return parseInt(i4.textContent);
                        if (double) return parseFloat(double.textContent);
                        if (string) return string.textContent;
                    }
                    
                    return 0; // Success
                } catch (error) {
                    return { error: 'Failed to parse XML response: ' + error.message };
                }
            }
        }

        // 创建XML-RPC客户端实例 (使用Node.js增强版本)
        const robotClient = new NodeXMLRPCClient(ROBOT_IP, parseInt(ROBOT_PORT));

        // 焊接动作实现
        class WeldingController {
            constructor(robotClient) {
                this.robotClient = robotClient;
                this.isArcActive = false;
                this.isWireFeedActive = false;
                this.isWireRetractActive = false;
            }

            // 起弧 - 启动焊接电弧
            async startArc() {
                try {
                    console.log('启动焊接电弧...');
                    
                    // 使用专用的起弧方法
                    const params = [WELDING_CONFIG.ioType, WELDING_CONFIG.arcNum, WELDING_CONFIG.arcTimeout];
                    console.log(`🔵 ARCStart() → 起弧启动 - 参数:`, params);
                    
                    const result = await this.robotClient.call('ARCStart', 
                        WELDING_CONFIG.ioType,      // IO类型: 0-控制器IO, 1-扩展IO
                        WELDING_CONFIG.arcNum,      // 焊机配置文件编号
                        WELDING_CONFIG.arcTimeout   // 起弧超时时间
                    );
                    
                    console.log(`🟢 ARCStart() → 返回值:`, result);
                    
                    if (result.error || result !== 0) {
                        console.error('起弧失败:', result.error || `错误码: ${result}`);
                        return false;
                    }
                    
                    this.isArcActive = true;
                    console.log('焊接电弧已启动 - 使用ARCStart方法');
                    return true;
                } catch (error) {
                    console.error('起弧过程中发生错误:', error);
                    return false;
                }
            }

            // 停止起弧

        // 机器人信息管理类
        class RobotInfoManager {
            constructor(robotClient) {
                this.robotClient = robotClient;
                this.errorStatus = {
                    mainCode: 0,
                    subCode: 0,
                    lastCheckTime: null
                };
            }

            // 检查并清理机器人错误代码
            async checkAndClearErrors() {
                try {
                    console.log("\n=== 检查并清理机器人错误代码 ===");
                    
                    // 获取当前错误代码
                    const errorResult = await this.robotClient.call('GetRobotErrorCode');
                    console.log("GetRobotErrorCode 原始返回值:", errorResult);
                    
                    if (errorResult !== null && errorResult !== undefined && !errorResult.error) {
                        // 解析错误代码，GetRobotErrorCode返回格式为 [error_status, maincode, subcode]
                        let maincode, subcode, error_status;
                        
                        if (Array.isArray(errorResult)) {
                            // 正确的格式：[error_status, maincode, subcode]
                            error_status = errorResult[0] || 0;
                            maincode = errorResult[1] || 0;
                            subcode = errorResult[2] || 0;
                            console.log(`GetRobotErrorCode解析: error_status=${error_status}, maincode=${maincode}, subcode=${subcode}`);
                        } else if (typeof errorResult === 'number') {
                            // 如果返回单个数值，可能需要解析为主码和子码
                            error_status = 0;
                            maincode = Math.floor(errorResult / 1000);
                            subcode = errorResult % 1000;
                            console.log(`单数值解析: maincode=${maincode}, subcode=${subcode}`);
                        } else if (errorResult === 0) {
                            // 如果返回0，表示无错误
                            error_status = 0;
                            maincode = 0;
                            subcode = 0;
                        } else {
                            // 其他情况，假设无错误
                            console.warn("未知的错误代码格式:", errorResult, "假设无错误");
                            error_status = 0;
                            maincode = 0;
                            subcode = 0;
                        }
                        
                        console.log(`当前机器人错误代码 - 主码: ${maincode}, 子码: ${subcode}`);
                        
                        // 更新错误状态
                        this.errorStatus.mainCode = maincode;
                        this.errorStatus.subCode = subcode;
                        this.errorStatus.lastCheckTime = new Date();
                        
                        // 如果有错误，尝试重置
                        if (maincode !== 0 || subcode !== 0) {
                            console.log("检测到机器人错误，正在尝试重置...");
                            
                            // 调用重置错误方法
                            const resetResult = await this.robotClient.call('ResetAllError');
                            console.log("重置错误结果:", resetResult);
                            
                            // 等待1秒
                            await this.sleep(1000);
                            
                            // 再次检查错误代码
                            const recheckResult = await this.robotClient.call('GetRobotErrorCode');
                            console.log("重置后错误代码检查结果:", recheckResult);
                            
                            if (recheckResult !== null && recheckResult !== undefined && !recheckResult.error) {
                                let newMaincode, newSubcode, newErrorStatus;
                                
                                if (Array.isArray(recheckResult)) {
                                    // 正确的格式：[error_status, maincode, subcode]
                                    newErrorStatus = recheckResult[0] || 0;
                                    newMaincode = recheckResult[1] || 0;
                                    newSubcode = recheckResult[2] || 0;
                                    console.log(`重置后GetRobotErrorCode解析: error_status=${newErrorStatus}, maincode=${newMaincode}, subcode=${newSubcode}`);
                                } else if (typeof recheckResult === 'number') {
                                    newErrorStatus = 0;
                                    newMaincode = Math.floor(recheckResult / 1000);
                                    newSubcode = recheckResult % 1000;
                                } else if (recheckResult === 0) {
                                    newErrorStatus = 0;
                                    newMaincode = 0;
                                    newSubcode = 0;
                                } else {
                                    console.warn("重置后未知的错误代码格式:", recheckResult, "假设无错误");
                                    newErrorStatus = 0;
                                    newMaincode = 0;
                                    newSubcode = 0;
                                }
                                
                                console.log(`重置后错误代码 - 主码: ${newMaincode}, 子码: ${newSubcode}`);
                                
                                // 更新错误状态
                                this.errorStatus.mainCode = newMaincode;
                                this.errorStatus.subCode = newSubcode;
                                
                                if (newMaincode === 0 && newSubcode === 0) {
                                    console.log("✅ 机器人错误已成功重置");
                                    this.updateErrorStatusUI(true, "错误已重置");
                                    return true;
                                } else {
                                    console.log("⚠️ 机器人错误重置失败，请手动检查");
                                    this.updateErrorStatusUI(false, `重置失败 - 主码:${newMaincode} 子码:${newSubcode}`);
                                    return false;
                                }
                            } else {
                                console.log("⚠️ 重置后无法检查错误状态，错误信息:", recheckResult?.error);
                                this.updateErrorStatusUI(false, "重置后检查失败");
                                return false;
                            }
                        } else {
                            console.log("✅ 机器人当前无错误代码");
                            this.updateErrorStatusUI(true, "无错误");
                            return true;
                        }
                    } else {
                        const errorMsg = errorResult?.error || "未知错误";
                        console.error('获取错误代码失败:', errorMsg, "原始结果:", errorResult);
                        this.updateErrorStatusUI(false, `获取失败: ${errorMsg}`);
                        return false;
                    }
                } catch (error) {
                    console.error('检查错误代码过程中发生异常:', error);
                    this.updateErrorStatusUI(false, `检查异常: ${error.message}`);
                    return false;
                }
            }

            updateErrorStatusUI(isOk, message) {
                const systemStatusDiv = document.getElementById('status');

                if (toast.parentNode) {
                    toast.classList.add('fade');

                updateStatus();
                arcStartBtn.classList.add('active');
                arcStartBtn.innerHTML = '<i class="bi bi-lightning-fill me-2"></i>起弧中...';
                arcStartBtn.disabled = false;
                console.log('🟢 起弧成功启动');
                
                // 可选：显示成功提示
                showStatusToast('✅ 起弧成功启动', 'success');
            } else {
                console.error('🔴 起弧失败');
                arcStartBtn.classList.remove('active');
                arcStartBtn.innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>起弧失败';
                arcStartBtn.disabled = false;
                
                // 显示失败提示
                showStatusToast('❌ 起弧启动失败', 'error');
                
                // 3秒后恢复正常状态
                setTimeout(() => {
                    arcStartBtn.innerHTML = '<i class="bi bi-play-fill me-2"></i>起弧';
                }, 3000);
            }
            
            // 重置防重复调用标志
            setTimeout(() => {
                arcStartDebounce = false;
            }, 500);
        }

        // 统一的起弧停止函数
        async function stopArcAction() {
            if (!arcActive) return; // 只在活跃时停止
            
            console.log('停止起弧操作...');
            
            // 显示停止中状态
            arcStartBtn.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>停止中...';
            arcStartBtn.disabled = true;
            
            await weldingController.stopArc();
            arcActive = false;
            updateStatus();
            arcStartBtn.classList.remove('active');
            arcStartBtn.innerHTML = '<i class="bi bi-play-fill me-2"></i>起弧';
            arcStartBtn.disabled = false;
            console.log('起弧已停止');
            
            // 可选：显示停止提示
            showStatusToast('⏹️ 起弧已停止', 'info');
        }

        arcStartBtn.addEventListener('mousedown', startArcAction);
        arcStartBtn.addEventListener('mouseup', stopArcAction);
        arcStartBtn.addEventListener('mouseleave', stopArcAction);

        wireFeedBtn.addEventListener('mousedown', async () => {
            // 按下鼠标开始进丝
            const success = await weldingController.startWireFeed();
            if (success) {
                wireFeedActive = true;
                updateStatus();
                wireFeedBtn.classList.add('active');
                wireFeedBtn.innerHTML = '<i class="bi bi-arrow-right-circle me-2"></i>进丝中...';
            } else {
                console.error('进丝失败');
            }
        });

        wireFeedBtn.addEventListener('mouseup', async () => {
            // 释放鼠标停止进丝
            await weldingController.stopWireFeed();
            wireFeedActive = false;
            updateStatus();
            wireFeedBtn.classList.remove('active');
            wireFeedBtn.innerHTML = '<i class="bi bi-arrow-right-circle me-2"></i>进丝';
        });

        wireFeedBtn.addEventListener('mouseleave', async () => {
            // 鼠标离开按钮时停止进丝
            if (wireFeedActive) {
                await weldingController.stopWireFeed();
                wireFeedActive = false;
                updateStatus();
                wireFeedBtn.classList.remove('active');
                wireFeedBtn.innerHTML = '<i class="bi bi-arrow-right-circle me-2"></i>进丝';
            }
        });

        wireRetractBtn.addEventListener('mousedown', async () => {
            // 按下鼠标开始退丝

                wireRetractActive = true;
                updateStatus();
                wireRetractBtn.classList.add('active');
                wireRetractBtn.innerHTML = '<i class="bi bi-arrow-left-circle me-2"></i>退丝中...';
            } else {
                console.error('退丝失败');
            }
        });

        wireRetractBtn.addEventListener('mouseup', async () => {
            // 释放鼠标停止退丝
            await weldingController.stopWireRetract();
            wireRetractActive = false;
            updateStatus();
            wireRetractBtn.classList.remove('active');
            wireRetractBtn.innerHTML = '<i class="bi bi-arrow-left-circle me-2"></i>退丝';
        });

        wireRetractBtn.addEventListener('mouseleave', async () => {
            // 鼠标离开按钮时停止退丝
            if (wireRetractActive) {
                await weldingController.stopWireRetract();
                wireRetractActive = false;

            }
        });

        // 点动X+按钮事件处理
        motionXPlusBtn.addEventListener('mousedown', async () => {
            // 按下鼠标开始X+运动
            const success = await weldingController.startMotionXPlus();
            if (success) {
                motionXPlusActive = true;
                updateStatus();
                motionXPlusBtn.classList.add('active');
                motionXPlusBtn.innerHTML = '<i class="bi bi-plus-circle me-2"></i>运动中...';
            } else {
                console.error('点动X+失败');
            }
        });

        motionXPlusBtn.addEventListener('mouseup', async () => {
            // 释放鼠标停止X+运动
            await weldingController.stopMotionXPlus();
            motionXPlusActive = false;
            updateStatus();
            motionXPlusBtn.classList.remove('active');
            motionXPlusBtn.innerHTML = '<i class="bi bi-plus-circle me-2"></i>点动X+';
        });

        motionXPlusBtn.addEventListener('mouseleave', async () => {
            // 鼠标离开按钮时停止X+运动
            if (motionXPlusActive) {
                await weldingController.stopMotionXPlus();
                motionXPlusActive = false;
                updateStatus();
                motionXPlusBtn.classList.remove('active');
                motionXPlusBtn.innerHTML = '<i class="bi bi-plus-circle me-2"></i>点动X+';
            }
        });

        // 点动X-按钮事件处理
        motionXMinusBtn.addEventListener('mousedown', async () => {
            // 按下鼠标开始X-运动
            const success = await weldingController.startMotionXMinus();
            if (success) {
                motionXMinusActive = true;

            } else {

            }
        });

        motionXMinusBtn.addEventListener('mouseup', async () => {
            // 释放鼠标停止X-运动
            await weldingController.stopMotionXMinus();
            motionXMinusActive = false;
            updateStatus();
            motionXMinusBtn.classList.remove('active');
            motionXMinusBtn.innerHTML = '<i class="bi bi-dash-circle me-2"></i>点动X-';
        });

        motionXMinusBtn.addEventListener('mouseleave', async () => {
            // 鼠标离开按钮时停止X-运动
            if (motionXMinusActive) {
                await weldingController.stopMotionXMinus();
                motionXMinusActive = false;
                updateStatus();
                motionXMinusBtn.classList.remove('active');
                motionXMinusBtn.innerHTML = '<i class="bi bi-dash-circle me-2"></i>点动X-';
            }
        });

        // 修改键盘事件处理器，集成焊接控制
        document.addEventListener('keydown', async (event) => {
            keysPressed.add(event.key.toLowerCase());
            
            // 检查是否按下起弧组合键 (Ctrl + Alt + P)
            if (keysPressed.has('control') && keysPressed.has('alt') && keysPressed.has('p')) {
                if (!arcActive) {
                    console.log('🔵 键盘快捷键: Ctrl+Alt+P 触发起弧');
                    await startArcAction();
                } else {
                    console.log('🔵 键盘快捷键: Ctrl+Alt+P 已按下，但起弧已激活，跳过');
                }
            }
            
            // 检查是否按下进丝组合键 (Ctrl + Alt + F)
            if (keysPressed.has('control') && keysPressed.has('alt') && keysPressed.has('f')) {
                if (!wireFeedActive) {
                    const success = await weldingController.startWireFeed();
                    if (success) {
                        wireFeedActive = true;
                        updateStatus();
                        wireFeedBtn.classList.add('active');
                        wireFeedBtn.innerHTML = '<i class="bi bi-arrow-right-circle me-2"></i>进丝中...';
                    }
                }
            }
            
            // 检查是否按下退丝组合键 (Ctrl + Alt + R)
            if (keysPressed.has('control') && keysPressed.has('alt') && keysPressed.has('r')) {
                if (!wireRetractActive) {
                    const success = await weldingController.startWireRetract();
                    if (success) {
                        wireRetractActive = true;
                        updateStatus();
                        wireRetractBtn.classList.add('active');
                        wireRetractBtn.innerHTML = '<i class="bi bi-arrow-left-circle me-2"></i>退丝中...';
                    }
                }
            }
        });

        document.addEventListener('keyup', async (event) => {
            keysPressed.delete(event.key.toLowerCase());
            
            // 检查是否释放起弧组合键
            if (!keysPressed.has('control') || !keysPressed.has('alt') || !keysPressed.has('p')) {
                await stopArcAction();
            }
            
            // 检查是否释放进丝组合键
            if (!keysPressed.has('control') || !keysPressed.has('alt') || !keysPressed.has('f')) {
                if (wireFeedActive) {
                    await weldingController.stopWireFeed();
                    wireFeedActive = false;
                    updateStatus();
                    wireFeedBtn.classList.remove('active');
                    wireFeedBtn.innerHTML = '<i class="bi bi-arrow-right-circle me-2"></i>进丝';
                }
            }
            
            // 检查是否释放退丝组合键
            if (!keysPressed.has('control') || !keysPressed.has('alt') || !keysPressed.has('r')) {
                if (wireRetractActive) {
                    await weldingController.stopWireRetract();
                    wireRetractActive = false;
                    updateStatus();
                    wireRetractBtn.classList.remove('active');
                    wireRetractBtn.innerHTML = '<i class="bi bi-arrow-left-circle me-2"></i>退丝';
                }
            }
        });

        // 添加连接状态检查
        async function checkRobotConnection() {
            try {
                const status = await weldingController.getRobotStatus();
                if (status.error) {
                    console.warn('机器人连接状态:', status.error);
                    connectionStatusDiv.textContent = '连接失败';
                    connectionStatusDiv.className = 'connection-status disconnected';
                } else {
                    console.log('机器人连接正常, 错误码:', status.errorCode);
                    connectionStatusDiv.textContent = '已连接';
                    connectionStatusDiv.className = 'connection-status connected';
                }
            } catch (error) {
                console.error('检查机器人连接失败:', error);
                connectionStatusDiv.textContent = '连接失败';
                connectionStatusDiv.className = 'connection-status disconnected';
            }
        }

        // 测试基本网络连接
        async function testBasicConnectivity() {
            console.log('测试基本网络连接...');
            try {
                // 尝试简单的HTTP请求到机器人IP
                const response = await fetch(`http://${ROBOT_IP}:${ROBOT_PORT}`, {
                    method: 'GET',
                    mode: 'no-cors',
                    timeout: 5000
                });
                console.log('基本连接测试 - 收到响应');
                return true;
            } catch (error) {
                console.error('基本连接测试失败:', error);
                return false;
            }
        }

        // 测试XML-RPC连接
        async function testXMLRPCConnection() {
            console.log('测试XML-RPC连接...');
            
            // 首先测试基本连接
            const basicConnectivity = await testBasicConnectivity();
            if (!basicConnectivity) {
                console.error('基本网络连接失败，跳过XML-RPC测试');
                return false;
            }
            
            try {
                // 尝试调用一个简单的机器人方法
                console.log('尝试调用GetRobotErrorCode方法测试连接...');
                const result = await robotClient.call('GetRobotErrorCode');
                console.log('GetRobotErrorCode调用结果:', result);
                
                if (result && result.error) {
                    console.error('XML-RPC连接测试失败:', result.error);
                    return false;
                } else {
                    console.log('XML-RPC连接测试成功:', result);
                    return true;
                }
            } catch (error) {
                console.error('XML-RPC连接测试异常:', error);
                return false;
            }
        }

        // 初始化机器人连接后的处理流程
        async function initializeRobotConnection() {
            console.log('开始初始化机器人连接流程...');
            
            try {
                // 1. 更新连接详情显示
                connectionDetailsDiv.textContent = `${ROBOT_IP}:${ROBOT_PORT}`;
                
                // 2. 检查并清理机器人错误代码
                console.log('步骤1: 检查和清理错误代码');
                const errorResult = await robotInfoManager.checkAndClearErrors();
                
                if (errorResult) {
                    console.log('错误检查和清理完成');
                } else {
                    console.warn('错误检查过程中遇到问题');
                }
                
                // 3. 更新连接状态为成功
                connectionStatusDiv.textContent = '已连接';
                connectionStatusDiv.className = 'connection-status connected';
                
                console.log('机器人连接初始化流程完成');
                return true;
                
            } catch (error) {
                console.error('初始化机器人连接过程中发生错误:', error);
                
                // 更新连接状态为失败
                connectionStatusDiv.textContent = '初始化失败';
                connectionStatusDiv.className = 'connection-status disconnected';
                
                // 更新系统状态
                const systemStatusDiv = document.getElementById('status');
                systemStatusDiv.innerHTML = `
                    <div style="color: #dc3545;">
                        ⚠️ 初始化失败
                    </div>
                `;
                
                return false;
            }
        }

        // 页面加载完成后检查连接
        window.addEventListener('load', async () => {
            setTimeout(async () => {
                console.log('开始检查机器人连接...');
                
                // 首先测试XML-RPC连接
                const xmlrpcTest = await testXMLRPCConnection();
                if (xmlrpcTest) {
                    console.log('XML-RPC连接正常，开始初始化机器人连接...');
                    
                    // 执行完整的初始化流程：版本获取 + 错误检查和清理
                    const initResult = await initializeRobotConnection();
                    
                    if (initResult) {
                        console.log('机器人初始化成功，连接已就绪');
                    } else {
                        console.warn('机器人初始化过程中遇到问题，但连接可能仍然可用');
                    }
                } else {
                    console.error('XML-RPC连接失败，无法与机器人通信');
                    connectionStatusDiv.textContent = 'XML-RPC失败';
                    connectionStatusDiv.className = 'connection-status disconnected';
                    
                    // 更新系统状态
                    const systemStatusDiv = document.getElementById('status');
                    systemStatusDiv.innerHTML = `
                        <div style="color: #dc3545;">
                            ⚠️ 无法连接到机器人
                        </div>
                        <div style="font-size: 0.85rem; color: #6c757d; margin-top: 5px;">
                            请检查网络连接和机器人状态
                        </div>
                    `;
                }
            }, 2000); // 延迟2秒检查，等待页面完全加载
        });

        // 定期检查连接状态和错误代码（每30秒）
        setInterval(async () => {
            console.log('定期检查机器人状态...');
            
            // 检查连接状态
            await checkRobotConnection();
            
            // 检查错误代码（但不自动重置，只显示状态）
            try {
                const errorResult = await robotInfoManager.robotClient.call('GetRobotErrorCode');
                console.log('定期检查 - GetRobotErrorCode 返回值:', errorResult);
                
                if (errorResult !== null && errorResult !== undefined && !errorResult.error) {
                    let maincode, subcode, error_status;
                    
                    if (Array.isArray(errorResult)) {
                        // 正确的格式：[error_status, maincode, subcode]
                        error_status = errorResult[0] || 0;
                        maincode = errorResult[1] || 0;
                        subcode = errorResult[2] || 0;
                        console.log(`定期检查GetRobotErrorCode解析: error_status=${error_status}, maincode=${maincode}, subcode=${subcode}`);
                    } else if (typeof errorResult === 'number') {
                        error_status = 0;
                        maincode = Math.floor(errorResult / 1000);
                        subcode = errorResult % 1000;
                    } else if (errorResult === 0) {
                        error_status = 0;
                        maincode = 0;
                        subcode = 0;
                    } else {
                        console.warn("定期检查 - 未知的错误代码格式:", errorResult, "假设无错误");
                        error_status = 0;
                        maincode = 0;
                        subcode = 0;
                    }
                    
                    console.log(`定期检查 - 错误代码: 主码: ${maincode}, 子码: ${subcode}`);
                    
                    // 更新错误状态（但不自动重置）
                    robotInfoManager.errorStatus.mainCode = maincode;
                    robotInfoManager.errorStatus.subCode = subcode;
                    robotInfoManager.errorStatus.lastCheckTime = new Date();
                    
                    if (maincode !== 0 || subcode !== 0) {
                        robotInfoManager.updateErrorStatusUI(false, `检测到错误`);
                        console.warn(`定期检查发现错误 - 主码: ${maincode}, 子码: ${subcode}`);
                    } else {
                        robotInfoManager.updateErrorStatusUI(true, "无错误");
                        console.log('定期检查 - 机器人状态正常');
                    }
                } else {
                    const errorMsg = errorResult?.error || "未知错误";
                    console.warn('定期检查：获取错误代码失败', errorMsg);
                    robotInfoManager.updateErrorStatusUI(false, `检查失败: ${errorMsg}`);
                }
            } catch (error) {
                console.warn('定期检查错误代码时发生异常:', error);
                robotInfoManager.updateErrorStatusUI(false, `检查异常: ${error.message}`);
            }
        }, 30000);
    </script>
